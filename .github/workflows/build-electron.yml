name: Build Electron App

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'

concurrency:
  group: electron-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Release tag must be v<major>.<minor>.<patch> and match package.json (v$version); got $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Delete old release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete dev-release --yes || true

      - name: Delete old release tag
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/dev-release" || true

  build:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: release-linux
          - platform: macos-latest
            artifact: release-macos
          - platform: windows-latest
            artifact: release-windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Electron app
        run: |
          bun run build:electron
          bunx tsc -p electron/tsconfig.json
          bunx electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.exe
            release/latest*.yml
            release/latest*.yaml
            release/*.blockmap
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'dev-release' }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Dev Build' }}
          body: ${{ github.ref_type == 'branch' && 'Latest dev build' || '' }}
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
          files: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.exe
            release/latest*.yml
            release/latest*.yaml
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
