name: Dependency Audit

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly Sunday 00:00 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun audit --prod
