name: Rust Checks

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/rust-checks.yml'
  workflow_call:
    inputs:
      run_clippy:
        type: boolean
        default: true
        description: 'Run cargo clippy'
      run_check:
        type: boolean
        default: true
        description: 'Run cargo check'
      run_fmt:
        type: boolean
        default: true
        description: 'Run cargo fmt check'

concurrency:
  group: rust-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt

      - name: cargo fmt
        if: ${{ inputs.run_fmt == true || inputs.run_fmt == null }}
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        if: ${{ inputs.run_clippy == true || inputs.run_clippy == null }}
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: cargo check
        if: ${{ inputs.run_check == true || inputs.run_check == null }}
        working-directory: src-tauri
        run: cargo check
